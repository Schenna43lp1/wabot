name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Montags, damit neue Sicherheitslücken auch ohne Commit auffallen
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26] # 24 ist das Minimum aus package.json
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pakete installieren
        run: npm ci --no-audit --no-fund

      - name: Syntax prüfen
        shell: bash
        run: |
          for file in src/*.js test/*.js; do
            node --check "$file"
          done

      - name: Tests ausführen
        run: npm test

      - name: start.cmd prüfen
        if: runner.os == 'Windows'
        shell: pwsh
        # Ohne Terminal bricht das Menü mit diesem Hinweis ab. Erscheint er,
        # haben Node-Prüfung, Modul-Prüfung und Menüstart funktioniert.
        run: |
          $output = ($null | cmd /d /c .\start.cmd 2>&1) -join "`n"
          Write-Host $output
          if ($output -notmatch 'Bitte start\.cmd per Doppelklick') {
            Write-Host '::error file=start.cmd::start.cmd erreicht das Menü nicht'
            exit 1
          }
          exit 0

  security:
    name: Abhängigkeiten prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Pakete installieren
        run: npm ci --no-audit --no-fund

      - name: Bekannte Sicherheitslücken suchen
        run: npm audit --omit=dev --audit-level=high

      - name: Paketsignaturen prüfen
        run: npm audit signatures

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose-Datei prüfen
        run: docker compose config -q

      - name: Image bauen
        run: docker build -t wa-alltagshelfer .

      - name: Module und Zeitzone im Image prüfen
        run: |
          docker run --rm --read-only wa-alltagshelfer node --input-type=module -e "
            await import('./src/whatsapp.js');
            await import('./src/product.js');
            await import('./src/setup.js');
            if (Intl.DateTimeFormat().resolvedOptions().timeZone !== 'Europe/Berlin') process.exit(1);
          "

  discord:
    name: Discord benachrichtigen
    needs: [test, security, docker]
    # Also after a failure, but not for runs replaced by a newer push.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ergebnis senden
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          # Repository secret. Never put the webhook URL into this file: the repository is public.
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          title: CI
          # Without the secret (e.g. pull requests from forks) the step does nothing.
          ack_no_webhook: true
